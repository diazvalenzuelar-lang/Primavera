<!DOCTYPE html>
<html lang="en">

    <title>FLORES</title>
    
    <style>
        /* Animaciones para la pantalla de desbloqueo */
        @keyframes latido-texto {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes flotar-regalo {
            0%, 100% { transform: translateY(0); }

    <!-- PANTALLA DE INTERACCIÓN (Obligatoria para reproducir música en celulares) -->

        <div style="font-size: 5rem; margin-bottom: 20px; animation: flotar-regalo 2s infinite ease-in-out;">🎁</div>
        <p style="color: #ffd700; font-family: 'Segoe UI', sans-serif; font-size: 1.5rem; font-weight: bold; text-align: center; padding: 0 30px; animation: latido-texto 1.5s infinite;">¡Toca la pantalla para descubrir tu sorpresa!</p>
    </div>

    <!-- Dedicatoria superpuesta a las flores -->
    <div style="position: absolute; top: 8%; left: 0; width: 100%; text-align: center; z-index: 9999; pointer-events: none;">
        <p style="color: #ffd700; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 1.25rem; font-style: italic; font-weight: bold; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 2px 2px 4px rgba(0,0,0,0.9); max-width: 90%; margin: 0 auto; line-height: 1.5;">
            “¡Sorpresa! 🌻 Flores amarillas para alguien especial. Esta vez nnovando en formato digital que estas flores no se marchitarán y te van a sacar una sonrisa"😉
        </p>
    </div>

        <source src="img/Floricienta.mp3" type="audio/mpeg">
    </audio>

    <!-- DECORACIÓN: Estrellas fugaces, pétalos y corazones -->
    <style>
        .estrella-fugaz {
            position: absolute; width: 150px; height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 100%);
            transform: rotate(-45deg); z-index: 5; opacity: 0; pointer-events: none;
        }
        .estrella-fugaz::after {
            content: ''; position: absolute; top: -2px; left: 0;
            width: 6px; height: 6px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px #fff;
        }
        .estrella-1 { top: 10%; right: 15%; animation: fugaz 6s linear infinite 1s; }
        .estrella-2 { top: 25%; right: 35%; animation: fugaz 9s linear infinite 5s; }
        @keyframes fugaz {
            0% { transform: rotate(-45deg) translateX(0); opacity: 1; }
            15% { transform: rotate(-45deg) translateX(-400px); opacity: 0; }
            100% { opacity: 0; }
        }
        .petalo-cae {
            background: linear-gradient(180deg, #fef08a 0%, #eab308 100%);
            border-radius: 50% 50% 20% 20%; box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        .elemento-flotante { position: fixed; pointer-events: none; z-index: 1; opacity: 0; }
        @keyframes caida-general {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(110vh) rotate(360deg) translateX(40px); opacity: 0; }
        }
    </style>
    
    <script>
        // SCRIPT 1: Reproducir música y ocultar pantalla de desbloqueo al tocar
        document.getElementById('pantalla-desbloqueo').addEventListener('click', function() {
            const audio = document.getElementById('musica-fondo');
            // Al hacer clic, forzamos la reproducción del audio
            audio.play().catch(error => console.log('El audio no pudo iniciar:', error));
            
            // Ocultamos la pantalla negra con un efecto suave
            this.style.opacity = '0';
            setTimeout(() => {
                this.style.display = 'none';
            }, 1000);
        });

        // SCRIPT 2: Magia de lluvia de corazones y pétalos
        function crearMagiaExpandida() {
            const cantidad = 60;
            for (let i = 0; i < cantidad; i++) {
                let el = document.createElement('div');
                el.classList.add('elemento-flotante');
                let esCorazon = Math.random() > 0.5;
                if (esCorazon) {
                    el.innerHTML = '💛';
                    el.style.fontSize = (10 + Math.random() * 15) + 'px';
                    el.style.filter = 'drop-shadow(0 0 8px rgba(255, 215, 0, 0.8))';
                } else {
                    el.classList.add('petalo-cae');
                    let ancho = 6 + Math.random() * 8;
                    el.style.width = ancho + 'px';
                    el.style.height = (ancho * 2.5) + 'px';
                }
                el.style.left = (Math.random() * 100) + 'vw';
                el.style.animation = `caida-general ${7 + Math.random() * 10}s linear infinite`;
                el.style.animationDelay = (Math.random() * 15) + 's';
                document.body.appendChild(el);
            }
        }
        window.addEventListener('DOMContentLoaded', crearMagiaExpandida);
    </script>
    <script src="main.js"></script>
