    <!-- DECORACIÓN: Estrellas fugaces, pétalos y corazones -->
    <style>
        /* Estilos de las estrellas fugaces */
        .estrella-fugaz {
            position: absolute;
            width: 150px;
            height: 2px;
            /* La cabeza de la estrella es blanca y deja una estela transparente */
            background: linear-gradient(90deg, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 100%);
            transform: rotate(-45deg);
            z-index: 5;
            opacity: 0;
            pointer-events: none;
        }
        .estrella-fugaz::after {
            content: '';
            position: absolute;
            top: -2px;
            left: 0; /* La cabeza brillante */
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px #fff;
        }
        .estrella-1 {
            top: 10%;
            right: 15%;
            animation: fugaz 6s linear infinite 1s;
        }
        .estrella-2 {
            top: 25%;
            right: 35%;
            animation: fugaz 9s linear infinite 5s;
        }
        @keyframes fugaz {
            0% { transform: rotate(-45deg) translateX(0); opacity: 1; }
            15% { transform: rotate(-45deg) translateX(-400px); opacity: 0; }
            100% { opacity: 0; }
        }

        /* Estilos de la lluvia de pétalos */
        .petalo-cae {
            background: linear-gradient(180deg, #fef08a 0%, #eab308 100%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        .elemento-flotante {
            position: fixed;
            pointer-events: none;
            z-index: 1; 
            opacity: 0;
        }
        @keyframes caida-general {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(110vh) rotate(360deg) translateX(40px); opacity: 0; }
        }
    </style>
    
    <script>
        function crearMagiaExpandida() {
            const cantidad = 60; // Aumentamos la cantidad para que llene la pantalla
            for (let i = 0; i < cantidad; i++) {
                let el = document.createElement('div');
                el.classList.add('elemento-flotante');
                
                // Alternar entre corazones amarillos y pétalos
                let esCorazon = Math.random() > 0.5;
                if (esCorazon) {
                    el.innerHTML = '💛';
                    el.style.fontSize = (10 + Math.random() * 15) + 'px';
                    el.style.filter = 'drop-shadow(0 0 8px rgba(255, 215, 0, 0.8))';
                } else {
                    el.classList.add('petalo-cae');
                    let ancho = 6 + Math.random() * 8;
                    el.style.width = ancho + 'px';
                    el.style.height = (ancho * 2.5) + 'px';
                }
                
                // Ahora abarcan el 100% del ancho de la pantalla
                el.style.left = (Math.random() * 100) + 'vw';
                
                // Tiempos aleatorios para un efecto de caída natural
                el.style.animation = `caida-general ${7 + Math.random() * 10}s linear infinite`;
                el.style.animationDelay = (Math.random() * 15) + 's';
                
                document.body.appendChild(el);
            }
        }
        window.addEventListener('DOMContentLoaded', crearMagiaExpandida);
    </script>
