<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Enlaces originales base -->
    <link rel="stylesheet" href="DATOS/css/style.css">
    <link rel="icon" href="DATOS/img/flowers.png" type="image/x-icon">
    <title>FLORES PARA TI</title>
    
    <!-- Importación de las fuentes: Chewy (divertida) y Quicksand (para un botón limpio) -->
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Fondo lila y alineación central perfecta */
        body {
            background-color: #d8b4e2 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            min-height: 100vh !important;
            margin: 0;
            gap: 25px; /* Espaciado uniforme entre los elementos */
        }
        
        /* Letras HOLA */
        .greetings {
            font-family: 'Chewy', cursive !important;
            color: #4a154b !important;
            font-size: 4.5rem !important; /* Más grande y llamativo */
            margin: 0 !important;
            letter-spacing: 5px !important;
            text-shadow: 4px 4px 0px rgba(255, 255, 255, 0.7) !important; /* Sombra tipo sticker */
            animation: fadeInDown 1s ease-out;
        }
        
        /* Contenedor e imagen de Kuromi */
        .image-wrapper {
            position: relative;
            animation: flotar 3s infinite ease-in-out;
            z-index: 10;
        }
        .image-wrapper img {
            width: 250px;
            /* TRUCO PRO: Elimina el fondo blanco de tu imagen automáticamente */
            mix-blend-mode: multiply; 
            filter: contrast(1.05);
        }
        
        /* Letras SON PARA TI */
        .description {
            font-family: 'Chewy', cursive !important;
            color: #ff007f !important;
            font-size: 2.5rem !important;
            margin: 0 !important;
            letter-spacing: 2px !important;
            text-shadow: 3px 3px 0px rgba(255, 255, 255, 0.7) !important;
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }
        
        /* Botón interactivo profesional */
        .btn-action {
            font-family: 'Quicksand', sans-serif !important;
            background-color: #ffff00 !important;
            color: #2d0d2e !important;
            font-size: 1.3rem !important;
            font-weight: 700 !important;
            padding: 16px 45px !important;
            border-radius: 50px !important;
            border: 3px solid #2d0d2e !important;
            text-decoration: none !important;
            /* Sombra dura estilo diseño moderno de apps */
            box-shadow: 5px 6px 0px #2d0d2e !important; 
            transition: all 0.2s ease !important;
            margin-top: 10px !important;
            animation: fadeInUp 1s ease-out 0.6s backwards;
            -webkit-tap-highlight-color: transparent;
            display: inline-block;
        }
        
        /* Efecto al pasar el dedo/mouse */
        .btn-action:hover {
            transform: translate(-2px, -2px) !important;
            box-shadow: 7px 8px 0px #2d0d2e !important;
        }
        
        /* Efecto de hundimiento al hacer clic */
        .btn-action:active {
            transform: translate(5px, 6px) !important;
            box-shadow: 0px 0px 0px #2d0d2e !important;
        }
        
        /* Animaciones base */
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    
    <!-- Texto Inicial -->
    <h1 class="greetings">HOLA</h1>

    <!-- Imagen de Kuromi con transparencia aplicada -->
    <div class="image-wrapper">
        <img src="DATOS/Kuromi.png" alt="Kuromi">
    </div>

    <!-- Texto Secundario -->
    <h2 class="description">SON PARA TI &lt;3</h2>
    
    <!-- Botón hacia el jardín de flores (Estructura HTML corregida) -->
    <a href="DATOS/FLORES.html" class="btn-action">CLICK PLEASE</a>

</body>
</html>
